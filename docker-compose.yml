version: '3.8'

services:
  api:
    build: .
    container_name: be-hands-on-api
    ports:
      - 5001:5001
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      # Must match ports: "5001:5001" — app binds to process.env.PORT
      PORT: "5001"
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    container_name: be-handson-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: